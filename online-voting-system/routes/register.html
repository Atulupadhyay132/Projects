<html>

<head>
    <title>online voting system - registeratio</title>
    <link rel="stylesheet" href="../css/stylesheet.css">
</head>

<body class="home-bg">
    <style>
        #address {
            width: 30%;
        }

        #imagepart {
            border: 2px solid black;
            border-radius: 5px;
            padding: 10px;
            width: 30%;
        }

        #role {
            border: 2px solid black;
            border-radius: 5px;
            padding: 10px;
            width: 30%;
        }

        #role select {
            border-radius: 5px;
            padding: 10px;

        }
    </style>
    <center>
        <div id="headerSection">
            <h1>Online Voting System</h1>
        </div>
        <hr>
        <div id="bodySection">
            <h3>Registration</h3>
            <form action="../api/register.php" method="POST" enctype="multipart/form-data">
                <input type="text" name="name" placeholder="Enter name">
                <input type="number" name="aadhaar" placeholder="Enter Aadhaar Number" maxlength="12"
                    oninput="this.value=this.value.slice(0,12)"><br><br>
                <input type="number" name="mobile" placeholder="Enter Mobile number" maxlength="10"
                    oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,10)" required><br><br>


                <input type="text" name="secret" placeholder="Secret Answer (e.g., Your favorite color?)"
                    required><br><br>

                <input type="password" name="password" placeholder="password">
                <input type="password" name="cpassword" placeholder="Confirm password"><br><br>
                <input id="address" type="text" name="address" placeholder="Address"><br><br>

                <div id="imagepart">
                    Upload image: <input type="file" name="photo">
                </div>
                <br><br>
                <div id="role">
                    Select role:<select name="role">
                        <option value="1">Voter</option>
                        <option value="2">Group</option>
                    </select>
                </div>

                <br>
                <button style=" padding: 5px;
                            font-size: 15px;
                             border-radius: 5px;
                             background-color: #48dbfb;
                              color: white;">
                    Register</button><br><br>
                Already user? <a href="../index.html">Login here</a>
            </form>
        </div>
    </center>
</body>


</html>
